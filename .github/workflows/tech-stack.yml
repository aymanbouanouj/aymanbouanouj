name: Refresh verified public Tech Stack

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-profile-writes
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch GitHub Linguist and refresh artwork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Compile source before generating fresh assets
        run: python3 -m compileall -q scripts tests
      - name: Fetch official public repository languages
        run: python3 scripts/tech_stack.py --fetch
      - name: Generate and verify SVG
        run: |
          python3 scripts/tech_stack.py --render
          python3 scripts/tech_stack.py --verify
          python3 -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --verify
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
      - name: Commit only verified public Tech Stack snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/tech-stack.json assets/mobile/ assets/tech-stack-dark.svg assets/tech-stack-light.svg
          if git diff --cached --quiet; then
            echo 'No changes to Tech Stack'
            exit 0
          fi
          git commit -m 'chore: refresh verified public tech stack [skip ci]'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
