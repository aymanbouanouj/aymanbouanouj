name: Profile security and integrity

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    name: Offline profile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Python
        run: python3 -m compileall -q scripts tests
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check tracked file privacy and owner notices
        run: python3 scripts/check_public_surface.py
      - name: Validate README, SVG and PNG provenance
        run: |
          python3 scripts/validate.py
          python3 scripts/mobile_png.py --verify
          python3 scripts/tech_stack.py --verify
          python3 scripts/engineering.py --verify

  secret-scan:
    name: Full-history secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits using GitHub integration
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0, Node.js 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Explicitly scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --is-shallow-repository | grep -qx false
          count="$(git rev-list --all --count)"
          test "$count" -gt 1 || { echo "ERROR: incomplete commit history"; exit 1; }
          echo "Full-history Gitleaks scan across $count reachable Git commits"
          if command -v gitleaks >/dev/null 2>&1; then
            binary="$(command -v gitleaks)"
          else
            shopt -s nullglob
            candidates=(/tmp/gitleaks-*/gitleaks)
            test "${#candidates[@]}" -gt 0 || { echo "ERROR: Gitleaks binary missing after pinned action"; exit 1; }
            binary="${candidates[0]}"
          fi
          "$binary" version
          "$binary" git --redact --log-opts="--all" .
