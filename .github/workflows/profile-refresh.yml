name: Scheduled verified profile refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push only checked public evidence and statistics'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '23 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: verified-profile-writes
  cancel-in-progress: false

jobs:
  verify:
    name: Inspect public sources without writing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Offline tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
      - name: Query public project evidence and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/tech_stack.py --fetch
          python3 scripts/tech_stack.py --render
          python3 scripts/engineering.py --fetch
          python3 scripts/engineering.py --render
          python3 scripts/engineering.py --verify
          python3 scripts/tech_stack.py --verify
          python3 -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/mobile_png.py --verify
      - name: Inspect contribution API and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_contributions.py
          python3 scripts/render_profile.py --data data/contributions.json
          python3 -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/validate.py
          echo 'Read-only verification complete; no changes pushed.'

  publish:
    name: Update verified profile only
    if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Refresh and validate public evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/tech_stack.py --fetch
          python3 scripts/tech_stack.py --render
          python3 scripts/engineering.py --fetch
          python3 scripts/engineering.py --render
          python3 scripts/fetch_contributions.py
          python3 scripts/render_profile.py --data data/contributions.json
          python3 -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/mobile_png.py --verify
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
          python3 scripts/tech_stack.py --verify
          python3 scripts/engineering.py --verify
      - name: Commit strictly generated assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/mobile/ data/contributions.json data/tech-stack.json data/engineering.json \
            assets/contributions-dark.svg assets/contributions-light.svg \
            assets/stats-dark.svg assets/stats-light.svg \
            assets/tech-stack-dark.svg assets/tech-stack-light.svg \
            assets/engineering-dark.svg assets/engineering-light.svg
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
            exit 0
          fi
          git commit -m 'chore: refresh verified profile evidence [skip ci]'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
