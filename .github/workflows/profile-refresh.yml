name: Scheduled verified profile refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push only checked public evidence and statistics'
        type: boolean
        required: true
        default: false
  schedule:
    # Read-only unless explicitly enabled with a repository Actions variable.
    - cron: '23 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: verified-profile-writes
  cancel-in-progress: false

jobs:
  verify:
    name: Inspect public sources without writing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Check Python syntax before refreshing generated artifacts
        run: python3 -m compileall -q scripts tests
      - name: Query public project evidence and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/tech_stack.py --fetch
          python3 scripts/tech_stack.py --render
          python3 scripts/engineering.py --fetch
          python3 scripts/engineering.py --render
          python3 scripts/engineering.py --verify
          python3 scripts/tech_stack.py --verify
          python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/mobile_png.py --verify
      - name: Inspect contribution API and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_contributions.py
          python3 scripts/render_profile.py --data data/contributions.json --no-static
          python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/mobile_png.py --verify
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
          echo 'Read-only verification complete; no changes pushed.'

  publish:
    name: Update verified profile only
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_PROFILE_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish == true && github.actor == 'aymanbouanouj')) }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: true
      - name: Refresh and validate public evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/tech_stack.py --fetch
          python3 scripts/tech_stack.py --render
          python3 scripts/engineering.py --fetch
          python3 scripts/engineering.py --render
          python3 scripts/fetch_contributions.py
          python3 scripts/render_profile.py --data data/contributions.json --no-static
          python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
          python3 scripts/mobile_png.py --render
          python3 scripts/mobile_png.py --switch-readme
          python3 scripts/mobile_png.py --verify
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
          python3 scripts/tech_stack.py --verify
          python3 scripts/engineering.py --verify
      - name: Create review pull request for verified generated assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${GITHUB_ACTOR}" = "aymanbouanouj" || { echo 'Only the owner may manually publish verified profile updates'; exit 1; }
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/mobile/ data/contributions.json data/tech-stack.json data/engineering.json \
            assets/hero-dark.svg assets/hero-light.svg \
            assets/logo-dark.svg assets/logo-light.svg \
            assets/contributions-dark.svg assets/contributions-light.svg \
            assets/stats-dark.svg assets/stats-light.svg \
            assets/tech-stack-dark.svg assets/tech-stack-light.svg \
            assets/engineering-dark.svg assets/engineering-light.svg
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
            exit 0
          fi
          review_branch="automation/profile-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${review_branch}"
          git commit -m 'chore: propose verified profile evidence update'
          git push -u origin "${review_branch}"
          # GitHub requires repository Actions setting "Allow GitHub Actions to
          # create and approve pull requests" for this command to succeed.
          # GITHUB_TOKEN-created pull requests do not normally trigger push/PR
          # workflows. Manually dispatch security-ci.yml on the review branch
          # and codeql.yml on that same branch to verify both scanners.
          # and verify the checks on the PR's exact head SHA before merging.
          # Never auto-merge or bypass rules.
          gh pr create --base main --head "${review_branch}" \
            --title "chore: review verified profile update" \
            --body "Verified GitHub contribution/project evidence. Please review generated data and artwork, manually run Profile security and integrity and CodeQL Advanced using Actions workflow_dispatch on this review branch (GITHUB_TOKEN-created PRs do not automatically trigger CI); verify each job passed against the exact head commit before merging."
