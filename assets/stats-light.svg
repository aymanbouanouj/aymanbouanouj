<svg xmlns="http://www.w3.org/2000/svg" width="495" height="500" viewBox="0 0 495 500" role="img" aria-labelledby="t d"><title id="t">GitHub activity analytics</title><desc id="d">Contribution totals, active days and verified monthly graph. No invented metrics.</desc><style>
  @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  @keyframes draw{from{opacity:0}to{opacity:1}}
  @keyframes load{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .enter{animation:appear .8s ease-out both}
  .cell{animation:draw .44s ease-in both}
  .line{animation:draw .32s ease-in both}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:load .6s ease-out both}
  .cursor{animation:pulse 1.3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.enter,.cell,.line,.bar,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
 </style><rect width="495" height="500" rx="16" fill="#fcfcff"/><rect x="1" y="1" width="493" height="498" rx="15" fill="none" stroke="#cbd2df"/><rect x="1" y="1" width="493" height="32" rx="15" fill="#f1f3fa"/><rect x="1" y="19" width="493" height="14" fill="#f1f3fa"/><path d="M1 33 H494" stroke="#cbd2df"/><circle cx="24" cy="17" r="4" fill="#ff6467"/><circle cx="41" cy="17" r="4" fill="#f5c35b"/><circle cx="58" cy="17" r="4" fill="#47ce9b"/><text x="247" y="21" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#556378">ayman@github: ~ / metrics --verified</text><text x="20" y="65" font-family="Consolas,monospace" font-size="14" fill="#117d86">$ ./stats.sh <tspan fill="#556378">--github</tspan></text><rect x="20" y="85" width="217" height="93" rx="9" stroke="#cbd2df" fill="#f5f6fb"/><text x="35" y="113" font-family="Consolas,monospace" font-size="11" fill="#556378">CONTRIBUTIONS</text><text class="enter" x="35" y="155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#117d86">—</text><rect x="258" y="85" width="217" height="93" rx="9" stroke="#cbd2df" fill="#f5f6fb"/><text x="273" y="113" font-family="Consolas,monospace" font-size="11" fill="#556378">ACTIVE DAYS</text><text class="enter" x="273" y="155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172033">—</text><rect x="20" y="191" width="217" height="93" rx="9" stroke="#cbd2df" fill="#f5f6fb"/><text x="35" y="219" font-family="Consolas,monospace" font-size="11" fill="#556378">CURRENT STREAK</text><text class="enter" x="35" y="261" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172033">—</text><rect x="258" y="191" width="217" height="93" rx="9" stroke="#cbd2df" fill="#f5f6fb"/><text x="273" y="219" font-family="Consolas,monospace" font-size="11" fill="#556378">LONGEST STREAK</text><text class="enter" x="273" y="261" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172033">—</text><rect x="20" y="308" width="455" height="163" rx="9" stroke="#cbd2df" fill="#f5f6fb"/><text x="36" y="335" font-family="Consolas,monospace" font-size="12" fill="#556378">contributions / month</text><text x="247" y="402" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#172033">AWAITING FIRST SYNC</text><text x="247" y="428" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#556378">All counts will come from GitHub.</text></svg>