<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">Ayman Bounaouj — original developer brand</title><desc id="d">Ayman Bounaouj, software developer. Original AB logo with purple upward arrow, rendered in a terminal-style banner.</desc><style>
  @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
