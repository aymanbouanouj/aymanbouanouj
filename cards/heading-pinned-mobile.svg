<svg xmlns="http://www.w3.org/2000/svg" width="680" height="41" viewBox="0 0 680 41" role="img" aria-labelledby="title desc"><title id="title">Pinned Repositories</title><desc id="desc">Public source and repository totals</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a28"/><stop offset="1" stop-color="#11131e"/></linearGradient><linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8d43ff"/><stop offset="1" stop-color="#b85cff"/></linearGradient></defs><style>@font-face{font-family:ProfilePoppins;font-weight:600;src:url(data:font/woff;base64,) format('woff')}text{font-family:ProfilePoppins,Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@keyframes grow{from{transform:scaleY(.16)}to{transform:scaleY(1)}}
@keyframes glint{0%,100%{opacity:1}45%{opacity:.62}}
.rise,.fade,.grow,.glint{animation-fill-mode:backwards;animation-delay:var(--delay,0ms);
animation-duration:380ms;animation-timing-function:cubic-bezier(.21,.65,.29,1)}
.rise{animation-name:rise}.fade{animation-name:fade}.glint{animation-name:glint;animation-duration:640ms}
.grow{animation-name:grow;transform-box:fill-box;transform-origin:center bottom}
@media (prefers-reduced-motion: reduce){
.rise,.fade,.grow,.glint{animation:none!important;opacity:1!important;transform:none!important}
}</style>
<g transform="translate(8 10) scale(1.16667)"><path d="m15 3 6 6-4 1-3 5-5 1-1-5 5-3 2-5Zm-7 13-5 5" fill="none" stroke="#bd8dff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="34" font-size="27" font-weight="600" fill="#f6f3fc" text-anchor="start" letter-spacing="-.55">Pinned Repositories</text><text x="672" y="33" font-size="16" font-weight="400" fill="#b4adc5" text-anchor="end" letter-spacing="0"></text>
</svg>
