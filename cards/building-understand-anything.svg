<svg xmlns="http://www.w3.org/2000/svg" width="376" height="61" viewBox="0 0 376 61" role="img" aria-labelledby="title desc"><title id="title">Understand-Anything</title><desc id="desc">Last publicly pushed 2026-11-17 UTC. Opens the repository.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a28"/><stop offset="1" stop-color="#11131e"/></linearGradient><linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8d43ff"/><stop offset="1" stop-color="#b85cff"/></linearGradient></defs><style>@font-face{font-family:ProfilePoppins;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:ProfilePoppins;font-weight:600;src:url(data:font/woff;base64,) format('woff')}text{font-family:ProfilePoppins,Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
