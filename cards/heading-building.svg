<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="52" viewBox="0 0 1160 52" role="img" aria-labelledby="title desc"><title id="title">Recently Updated Projects</title><desc id="desc">Last public push</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a28"/><stop offset="1" stop-color="#11131e"/></linearGradient><linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8d43ff"/><stop offset="1" stop-color="#b85cff"/></linearGradient></defs><style>@font-face{font-family:ProfilePoppins;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:ProfilePoppins;font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:ProfilePoppins,Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}text{opacity:.98}@keyframes rise{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@keyframes grow{from{transform:scaleY(.16)}to{transform:scaleY(1)}}
@keyframes glint{0%,100%{opacity:1}45%{opacity:.62}}
.rise,.fade,.grow,.glint{animation-fill-mode:backwards;animation-delay:var(--delay,0ms);
animation-duration:380ms;animation-timing-function:cubic-bezier(.21,.65,.29,1)}
.rise{animation-name:rise}.fade{animation-name:fade}.glint{animation-name:glint;animation-duration:640ms}
.grow{animation-name:grow;transform-box:fill-box;transform-origin:center bottom}
@media (prefers-reduced-motion: reduce){
.rise,.fade,.grow,.glint{animation:none!important;opacity:1!important;transform:none!important}
}</style>
